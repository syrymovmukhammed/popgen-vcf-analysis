# CI: builds the multi-sample VCF and the population-structure analysis on a
# fresh Ubuntu machine on every push to main. The real-genome mode can be
# started by hand: Actions → CI → Run workflow → mode: real.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "sim = simulated population (fast); real = 15 real E. coli genomes from NCBI (~10 min)"
        type: choice
        options: [sim, real]
        default: sim

permissions:
  contents: read

jobs:
  popgen:
    name: "genomes → minimap2 → VCF → distances → PCA / clusters / NJ tree"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      THREADS: 4
      MODE: ${{ inputs.mode || 'sim' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bioinformatics tools (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minimap2 samtools bcftools tabix

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the pipeline (MODE=${{ env.MODE }})
        run: bash run_all.sh

      - name: Acceptance tests
        run: bash tests/check_outputs.sh

      - name: Publish summary to the job page
        if: always()
        run: cat results/summary.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload VCFs, distance matrix, plots and tree
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: popgen-results-${{ env.MODE }}
          path: |
            results/03_vcf/
            results/04_distance/
            results/05_pca_clustering/
            results/summary.md
          retention-days: 14
